// ── Helpers ───────────────────────────────────────────────────────────────
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function fmt(n){ return '$' + Number(n||0).toLocaleString('es-AR'); }
function tod(){ return new Date().toISOString().slice(0,10); }
function minToHH(min){ return String(Math.floor(min/60)).padStart(2,'0')+':'+String(min%60).padStart(2,'0'); }
function hhToMin(hh){ const [h,m]=(hh||'00:00').split(':').map(Number); return h*60+m; }
function tenantSlug(nombre){ return (nombre||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'').replace(/-+/g,'-').replace(/^-|-$/g,'')||'mi-negocio'; }
function tryParseData(r){ const d=r?.data; if(!d) return null; if(typeof d==='string'){try{return JSON.parse(d);}catch(e){return null;}} return typeof d==='object'?d:null; }

function esBloqueado(bloqueos, fecha, hora){
  if(!bloqueos||!bloqueos.length) return false;
  const slotMin = hhToMin(hora);
  const diaSemana = new Date(fecha+'T12:00:00').getDay();
  return bloqueos.some(b=>{
    if(b.tipo==='dia_unico'){
      if(b.fecha!==fecha) return false;
      if(!b.horaInicio) return true;
      return slotMin>=hhToMin(b.horaInicio)&&slotMin<hhToMin(b.horaFin||'23:59');
    }
    if(b.tipo==='rango_fechas'){
      if(fecha<b.fechaInicio||fecha>b.fechaFin) return false;
      if(!b.horaInicio) return true;
      return slotMin>=hhToMin(b.horaInicio)&&slotMin<hhToMin(b.horaFin||'23:59');
    }
    if(b.tipo==='semanal'){
      if(parseInt(b.diaSemana)!==diaSemana) return false;
      if(!b.horaInicio) return true;
      return slotMin>=hhToMin(b.horaInicio)&&slotMin<hhToMin(b.horaFin||'23:59');
    }
    return false;
  });
}

// ── Resolución de slug → tenant ───────────────────────────────────────────
async function resolveSlug(slug){
  // Estrategia 1: UUID directo en tenant_id
  if(/^[0-9a-f]{8}-[0-9a-f]{4}-/i.test(slug)){
    const {data} = await sb.from('precios').select('tenant_id,data').eq('tenant_id', slug);
    if(data&&data.length) return { tenantId: slug, rows: data };
  }

  // Estrategia 2: JSONB contains — rápido, funciona si la columna es jsonb
  try {
    const {data: cfgRows, error} = await sb.from('precios')
      .select('tenant_id,data')
      .contains('data', {__slug: slug})
      .limit(5);
    if(!error && cfgRows && cfgRows.length){
      const tid = cfgRows[0].tenant_id;
      const {data: all} = await sb.from('precios').select('tenant_id,data').eq('tenant_id', tid).limit(50);
      return { tenantId: tid, rows: all||[] };
    }
  } catch(e){}

  // Estrategia 3: Fallback JS — orden descendente para que tenants nuevos
  // (IDs más grandes) aparezcan primero. Limit ampliado para mayor cobertura.
  const {data: allRows} = await sb.from('precios')
    .select('tenant_id,data').order('id',{ascending:false}).limit(1000);
  if(allRows && allRows.length){
    // Solo filas que parecen config (tienen __tenantName o __turnosCfg o __slug)
    const cfgCandidates = allRows.filter(r=>{
      const d = tryParseData(r);
      return d && (d.__tenantName || d.__turnosCfg || d.__slug);
    });
    const found = cfgCandidates.find(r=>{
      const d = tryParseData(r);
      if(!d) return false;
      // Comparar por __slug explícito
      if(d.__slug && d.__slug === slug) return true;
      // Comparar computando slug del nombre guardado
      if(d.__tenantName && tenantSlug(d.__tenantName) === slug) return true;
      return false;
    });
    if(found){
      const tid = found.tenant_id;
      const {data: tenantRows} = await sb.from('precios')
        .select('tenant_id,data').eq('tenant_id', tid);
      return { tenantId: tid, rows: tenantRows||[] };
    }
  }

  return null;
}

function parseRows(rows){
  let turnosCfg = {servicios:[],empleados:[],apertura:'09:00',cierre:'20:00',dias:[1,2,3,4,5,6]};
  let onlineCfg = {mensaje:'',insta:'',direccion:'',tel:''};
  let tenantNombre = '', tenantRubro = '';
  const cfgRow = rows.map(r=>({...r, _d: tryParseData(r)})).find(r=>r._d&&(r._d.__tipo==='cfg'||r._d.__turnosCfg));
  if(cfgRow){
    const d = cfgRow._d;
    if(d.__turnosCfg){
      turnosCfg = {...turnosCfg, ...d.__turnosCfg};
      if(d.__turnosCfg.apertura) turnosCfg.apertura = d.__turnosCfg.apertura;
      if(d.__turnosCfg.cierre)   turnosCfg.cierre   = d.__turnosCfg.cierre;
    }
    if(d.__onlineCfg) onlineCfg = {...onlineCfg, ...d.__onlineCfg};
    if(d.__tenantName) tenantNombre = d.__tenantName;
    if(d.__rubro)      tenantRubro  = d.__rubro;
  }
  // Servicios del catálogo de precios (overwrites turnosCfg servicios si hay)
  const durMap = {};
  (turnosCfg.servicios||[]).forEach(s=>{ durMap[(s.nombre||'').toLowerCase()] = s.duracion||30; });
  const itemsPrecios = rows
    .map(r=>tryParseData(r))
    .filter(d=>d&&!d.__tipo&&!d.__turnosCfg&&d.nombre)
    .filter(p=>(p.disponibilidad||'disponible')!=='no_disponible');
  if(itemsPrecios.length){
    turnosCfg.servicios = itemsPrecios.map(p=>({
      id: p.id, nombre: p.nombre,
      sector: p.categoria||p.sector||'',
      precio: parseFloat(p.precio)||0,
      duracion: durMap[(p.nombre||'').toLowerCase()]||p.duracion||30
    }));
  }
  return {turnosCfg, onlineCfg, tenantNombre, tenantRubro};
}

/* ── Servicio especial "A confirmar" — salones/barberías/manicurias ──────
   Se agrega al final de la lista de servicios. El admin define el servicio
   real cuando llega el cliente, a través del popup de finalización.         */
(function(){
  if(typeof renderBooking !== 'function') return;
  var _origRB = renderBooking;
  renderBooking = function(){
    var rubro = ((G.tenant && G.tenant.rubro) || '').toLowerCase();
    var esSalon = /sal[oó]n|belleza|peluq|manicur|u[nñ]as|barber|est[eé]tica|nail/i.test(rubro);
    if(esSalon && G.cfg && Array.isArray(G.cfg.servicios)){
      if(!G.cfg.servicios.some(function(s){ return s.id === '__aconfirmar__'; })){
        G.cfg.servicios = G.cfg.servicios.concat([{
          id: '__aconfirmar__',
          nombre: '📋 A confirmar',
          sector: '',
          precio: 0,
          duracion: 60
        }]);
      }
    }
    return _origRB.apply(this, arguments);
  };
})();

// ── Cambios de servicio y fecha ───────────────────────────────────────────
function onSrvChange(){
  const sel = document.getElementById('bServicio');
  if(!sel) return;
  const opt = sel.options[sel.selectedIndex];
  const precio = parseFloat(opt?.getAttribute('data-precio')||0);
  const txt = document.getElementById('bPrecioTxt');
  if(txt){
    txt.textContent = precio>0 ? fmt(precio) : 'Precio a consultar';
    txt.style.color = precio>0 ? '#c9a84c' : '#a89880';
  }
  const fecha = document.getElementById('bFecha')?.value;
  if(fecha) cargarSlots();
}

function onFechaChange(){
  const fecha = document.getElementById('bFecha')?.value;
  if(fecha) cargarSlots();
}

async function cargarSlots(){
  const fecha = document.getElementById('bFecha')?.value;
  const wrap = document.getElementById('bSlotsWrap');
  if(!fecha||!wrap) return;
  // Reset hora
  const horaInput = document.getElementById('bHora');
  if(horaInput) horaInput.value = '';

  const cfg = G.cfg;
  const DIAS = cfg.dias&&cfg.dias.length>0 ? cfg.dias : [1,2,3,4,5,6];
  const diaSel = new Date(fecha+'T12:00:00').getDay();
  const nomDia = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'][diaSel];

  if(!DIAS.includes(diaSel)){
    wrap.className = 'cerrado-banner';
    wrap.innerHTML = `❌ No atendemos los ${nomDia}s. Por favor elegí otro día.`;
    return;
  }

  wrap.className = 'msg-info';
  wrap.innerHTML = 'Cargando horarios...';

  // Slots ocupados de Supabase (confirmados + bloqueados + pendientes)
  // 'pendiente' bloquea el slot inmediatamente para evitar doble reserva
  const {data: ocuData} = await sb.from('turnos_solicitudes')
    .select('hora,estado')
    .eq('tenant_id', G.tenantId)
    .eq('fecha', fecha)
    .in('estado',['confirmado','bloqueado','pendiente']);

  const ocupados = new Set((ocuData||[]).map(s=>(s.hora||'').substring(0,5)));
  const bloqueos = new Set();

  // Bloqueos por empleado
  const empId = document.getElementById('bEmpleado')?.value||'';
  if(cfg.empleados&&cfg.empleados.length){
    const emps = empId
      ? [cfg.empleados.find(e=>String(e.id)===String(empId))].filter(Boolean)
      : cfg.empleados;
    const ap = hhToMin(cfg.apertura||'09:00');
    const ci = hhToMin(cfg.cierre||'20:00');
    for(let m=ap; m<=ci; m+=30){
      const hora = minToHH(m);
      if(emps.length&&emps.every(e=>esBloqueado(e.bloqueos||[],fecha,hora))){
        ocupados.add(hora); bloqueos.add(hora);
      }
    }
  }

  // Duración del servicio seleccionado — string comparison para IDs mixtos y '__aconfirmar__'
  const srvSel = document.getElementById('bServicio');
  const srvVal = srvSel ? String(srvSel.value || '') : '';
  const srv    = (cfg.servicios||[]).find(s => String(s.id) === srvVal);
  // Sin servicio válido: slotsNeeded=1, solo bloquea el slot exacto ocupado (sin cascada)
  const slotsNeeded = srv ? Math.ceil((srv.duracion || 30) / 30) : 1;

  // Generar slots cada 30 min
  const ap = hhToMin(cfg.apertura||'09:00');
  const ci = hhToMin(cfg.cierre||'20:00');
  const slots = [];
  for(let m=ap; m<=ci; m+=30){
    const hora = minToHH(m);
    // Slot M queda bloqueado si M + duración del servicio seleccionado pisa un slot ocupado
    let isOcu = false;
    for(let k=0; k<slotsNeeded; k++){
      if(ocupados.has(minToHH(m + k*30))){ isOcu=true; break; }
    }
    slots.push({hora, blq:bloqueos.has(hora), ocu:isOcu});
  }

  if(!slots.length){
    wrap.className = 'msg-info';
    wrap.innerHTML = 'Sin horarios configurados para este día.';
    return;
  }

  wrap.className = '';
  wrap.innerHTML = '';
  const grid = document.createElement('div');
  grid.className = 'slots-grid';
  slots.forEach(s=>{
    const d = document.createElement('div');
    if(s.blq){
      d.className = 'slot blq';
      d.innerHTML = `<span style="color:#a89880;text-decoration:line-through">${s.hora}</span><span class="slot-tag tag-blq">🚫 No disp.</span>`;
    } else if(s.ocu){
      d.className = 'slot ocu';
      d.innerHTML = `<span style="color:#c8b88a;text-decoration:line-through">${s.hora}</span><span class="slot-tag tag-ocu">Reservado</span>`;
    } else {
      d.className = 'slot';
      d.textContent = s.hora;
      d.onclick = () => selSlot(s.hora, d);
    }
    grid.appendChild(d);
  });
  wrap.appendChild(grid);

  const disp = slots.filter(s=>!s.ocu&&!s.blq).length;
  const note = document.createElement('div');
  note.style.cssText = 'font-size:.7rem;color:#a89880;margin-top:10px;text-align:center';
  note.textContent = disp ? 'Tocá un horario para seleccionarlo' : 'Todos los horarios de este día están reservados';
  wrap.appendChild(note);
}

function selSlot(hora, el){
  document.querySelectorAll('.slot.sel').forEach(d=>{ d.classList.remove('sel'); });
  el.classList.add('sel');
  document.getElementById('bHora').value = hora;
  document.getElementById('bErr').style.display = 'none';
}

// ── Enviar solicitud ──────────────────────────────────────────────────────
async function enviar(){
  const nombre = document.getElementById('bNombre')?.value.trim()||'';
  const tel    = document.getElementById('bTel')?.value.trim()||'';
  const srvId  = document.getElementById('bServicio')?.value||null;
  const empId  = document.getElementById('bEmpleado')?.value||null;
  const fecha  = document.getElementById('bFecha')?.value||'';
  const hora   = document.getElementById('bHora')?.value||'';
  const btn    = document.getElementById('bBtn');
  const errEl  = document.getElementById('bErr');

  errEl.style.display='none';
  const showErr = msg => { errEl.textContent=msg; errEl.style.display='block'; errEl.scrollIntoView({behavior:'smooth',block:'nearest'}); };

  if(!nombre){ showErr('Ingresá tu nombre.'); return; }
  if(!tel||tel.replace(/\D/g,'').length<6){ showErr('Ingresá un número de WhatsApp válido.'); return; }
  if(!fecha){ showErr('Elegí una fecha.'); return; }
  if(!hora){ showErr('Seleccioná un horario disponible.'); return; }

  if(btn.disabled) return;
  btn.disabled=true; btn.textContent='Enviando...';

  try {
    // Verificar que todos los slots necesarios siguen disponibles
    const _srvId0 = document.getElementById('bServicio')?.value||null;
    const _srv0 = (G.cfg.servicios||[]).find(s=>String(s.id)===String(_srvId0))||(G.cfg.servicios||[])[0]||{};
    const _dur0 = _srv0.duracion||30;
    const _sN = Math.ceil(_dur0/30);
    const _horasN = Array.from({length:_sN},(_,k)=>minToHH(hhToMin(hora)+k*30));
    const {data: previo} = await sb.from('turnos_solicitudes')
      .select('id,estado').eq('tenant_id',G.tenantId).eq('fecha',fecha)
      .in('hora',_horasN).in('estado',['confirmado','bloqueado']).limit(1);
    if(previo&&previo.length){
      showErr('Ese horario acaba de ser reservado. Por favor elegí otro.');
      btn.disabled=false; btn.textContent='Reservar turno';
      cargarSlots();
      return;
    }

    // Insertar como "pendiente" — el admin confirma
    const ts = new Date().toISOString();
    const {data: ins, error: insErr} = await sb.from('turnos_solicitudes').insert({
      tenant_id: G.tenantId,
      nombre, tel,
      servicio_id: srvId||null,
      empleado_id: empId ? (parseInt(empId)||null) : null,
      fecha, hora,
      estado: 'pendiente',
      created_at: ts
    }).select('id').single();

    if(insErr) throw new Error(insErr.message||'Error al reservar');

    // Bloquear slots adicionales si el servicio dura más de 30 min
    if(_sN > 1){
      const extras = [];
      for(let k=1; k<_sN; k++){
        extras.push({tenant_id:G.tenantId, nombre:'__extra__:'+(ins?.id||''), tel,
          servicio_id:srvId||null, empleado_id:empId?(parseInt(empId)||null):null,
          fecha, hora:minToHH(hhToMin(hora)+k*30), estado:'bloqueado', created_at:ts});
      }
      if(extras.length) await sb.from('turnos_solicitudes').insert(extras);
    }

    // Verificar race condition (otro cliente al mismo instante)
    const {data: todos} = await sb.from('turnos_solicitudes')
      .select('id,created_at,estado')
      .eq('tenant_id',G.tenantId).eq('fecha',fecha).eq('hora',hora)
      .in('estado',['confirmado','bloqueado','pendiente']);
    const conflicto = (todos||[]).some(t=>t.id!==ins.id&&t.created_at<=ts&&(t.estado==='confirmado'||t.estado==='bloqueado'));
    if(conflicto){
      await sb.from('turnos_solicitudes').delete().eq('id',ins.id);
      showErr('Ese horario acaba de ser reservado. Por favor elegí otro.');
      btn.disabled=false; btn.textContent='Reservar turno';
      cargarSlots();
      return;
    }

    // Éxito 🎉
    const cfg = G.cfg;
    const srvNombre = (cfg.servicios||[]).find(s=>String(s.id)===String(srvId))?.nombre||'el servicio';
    const fechaFmt = new Date(fecha+'T12:00:00').toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});

    // Datos adicionales para pantalla de confirmación
    const profNombre = empId
      ? ((cfg.empleados||[]).find(e=>String(e.id)===String(empId))?.nombre||'')
      : '';
    const rubroStr = (G.tenant?.rubro||'').toLowerCase();
    const rubroEmoji = rubroStr.includes('barber')||rubroStr.includes('salon')||rubroStr.includes('belleza') ? '✂️'
      : rubroStr.includes('telefon')||rubroStr.includes('tecnico')||rubroStr.includes('técnico') ? '🔧'
      : '⭐';
    const negWaTel = (G.online?.tel||'').replace(/\D/g,'');
    const waConfMsg = encodeURIComponent('Hola! Reservé un turno para el ' + fechaFmt + ' a las ' + hora + '. Quería consultarles algo.');
    const waLink = negWaTel ? 'https://wa.me/549'+negWaTel+'?text='+waConfMsg : '';
    const fechaCal = fecha.replace(/-/g,'');
    const horaCal = hora.replace(':','');
    const endMinCal = hhToMin(hora) + (_dur0||30);
    const endHoraCal = minToHH(endMinCal).replace(':','');
    const gcalTitle = encodeURIComponent('Turno en ' + (G.tenant?.nombre||'el negocio'));
    const gcalDetails = encodeURIComponent(srvNombre + (profNombre?' — '+profNombre:'') + (G.tenant?.nombre?' | '+G.tenant.nombre:''));
    const gcalLink = 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+gcalTitle+'&dates='+fechaCal+'T'+horaCal+'00/'+fechaCal+'T'+endHoraCal+'00&details='+gcalDetails;

    document.getElementById('mainCard').innerHTML = `
      <div style="text-align:center;padding:8px 0 20px">
        <div style="font-size:2.8rem;margin-bottom:8px">${rubroEmoji}</div>
        <div style="font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:800;color:#c9a84c;margin-bottom:3px">${esc(G.tenant?.nombre||'')}</div>
        <div style="font-size:.68rem;color:#585044;text-transform:uppercase;letter-spacing:.7px;margin-bottom:16px">Confirmación de reserva</div>
        <div style="display:inline-flex;align-items:center;gap:6px;background:rgba(76,175,125,.1);border:1px solid rgba(76,175,125,.3);border-radius:20px;padding:6px 16px;margin-bottom:20px">
          <span style="color:#4caf7d;font-size:.9rem">✓</span>
          <span style="font-size:.82rem;color:#4caf7d;font-weight:600">Solicitud enviada</span>
        </div>
      </div>

      <div style="background:#0a0a0a;border:1px solid #1e1e1e;border-radius:12px;padding:18px;margin-bottom:14px">
        <div style="display:flex;flex-direction:column;gap:0">
          <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0">
            <span style="font-size:.7rem;color:#a89880;text-transform:uppercase;letter-spacing:.5px">Servicio</span>
            <span style="font-size:.88rem;color:#f5f0e8;font-weight:600">${esc(srvNombre)}</span>
          </div>
          <div style="height:1px;background:#1e1e1e"></div>
          <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0">
            <span style="font-size:.7rem;color:#a89880;text-transform:uppercase;letter-spacing:.5px">Fecha</span>
            <span style="font-size:.88rem;color:#f5f0e8;font-weight:600">${esc(fechaFmt)}</span>
          </div>
          <div style="height:1px;background:#1e1e1e"></div>
          <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0">
            <span style="font-size:.7rem;color:#a89880;text-transform:uppercase;letter-spacing:.5px">Hora</span>
            <span style="font-size:.88rem;color:#f5f0e8;font-weight:600">🕐 ${esc(hora)}</span>
          </div>
          ${profNombre ? `
          <div style="height:1px;background:#1e1e1e"></div>
          <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0">
            <span style="font-size:.7rem;color:#a89880;text-transform:uppercase;letter-spacing:.5px">Profesional</span>
            <span style="font-size:.88rem;color:#f5f0e8;font-weight:600">${esc(profNombre)}</span>
          </div>` : ''}
        </div>
      </div>

      <div style="background:rgba(201,168,76,.06);border:1px solid rgba(201,168,76,.15);border-radius:10px;padding:13px 15px;margin-bottom:14px;font-size:.83rem;color:#a89880;line-height:1.65">
        ¡Te esperamos, <strong style="color:#f5f0e8">${esc(nombre)}</strong>!
        El negocio confirmará tu turno por WhatsApp al <strong style="color:#f5f0e8">${esc(tel)}</strong>.
        ${waLink ? `Ante cualquier consulta <a href="${waLink}" target="_blank" rel="noopener" style="color:#c9a84c;font-weight:600">escribinos por WhatsApp</a>.` : ''}
      </div>

      <a href="${gcalLink}" target="_blank" rel="noopener"
         style="display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border:1px solid #2e2e2e;border-radius:10px;color:#a89880;font-size:.84rem;text-decoration:none;margin-bottom:14px">
        📅 Agregar al calendario
      </a>

      <button class="btn" style="margin-top:0;background:#1a1a1a;color:#c9a84c;border:1px solid rgba(201,168,76,.3)" onclick="location.reload()">Hacer otra reserva</button>
    `;
  } catch(e){
    showErr(e.message||'Error al enviar. Intentá de nuevo.');
    btn.disabled=false; btn.textContent='Reservar turno';
  }
}

// ── Vista catálogo unificado (?negocio=SLUG) ──────────────────────────────
function renderCatalog(){
  const cfg    = G.cfg    || {servicios:[],empleados:[],apertura:'09:00',cierre:'20:00',dias:[1,2,3,4,5,6]};
  const online = G.online || {mensaje:'',insta:'',direccion:'',tel:''};
  const nombre = G.tenant?.nombre || G.tenantNombre || 'Negocio';
  document.getElementById('hdrNeg').textContent = nombre;
  document.title = nombre + ' — Servicios y turnos';

  const card = document.getElementById('mainCard');

  if(!cfg.servicios.length){
    card.innerHTML = `<div class="cat-hdr">
      <div class="cat-title">${esc(nombre)}</div>
      ${online.mensaje?`<div class="cat-subtitle">${esc(online.mensaje)}</div>`:''}
    </div>
    <div class="msg-info">Este negocio todavía no publicó sus servicios. Contactanos por WhatsApp para reservar.</div>`;
    _catWA(online, nombre);
    return;
  }

  // Agrupar por sector
  const bySector = {};
  cfg.servicios.forEach(s=>{
    const sec = s.sector || '';
    if(!bySector[sec]) bySector[sec] = [];
    bySector[sec].push(s);
  });
  const sectores = Object.keys(bySector);
  const multiSector = sectores.filter(k=>k).length > 1;

  const notaPrecios = online.notaPrecios||'';

  card.innerHTML = `
    <div class="cat-hdr">
      ${online.logo?`<div style="margin-bottom:12px"><img src="${online.logo}" alt="Logo" style="max-height:72px;max-width:180px;object-fit:contain;border-radius:8px"></div>`:''}
      <div class="cat-title">${esc(nombre)}</div>
      ${online.mensaje?`<div class="cat-subtitle">${esc(online.mensaje)}</div>`:''}
      ${online.direccion?`<div class="cat-addr">📍 ${esc(online.direccion)}</div>`:''}
    </div>
    ${notaPrecios?`<div class="cat-nota">ℹ️ ${esc(notaPrecios)}</div>`:''}
    ${sectores.map(sec=>`
      ${multiSector&&sec?`<div class="cat-sector-lbl">${esc(sec)}</div>`:''}
      ${bySector[sec].map(s=>`
        <div class="cat-row">
          <div style="min-width:0">
            <div class="cat-name">${esc(s.nombre)}</div>
            <div class="cat-det">${s.duracion||30} min${s.precio>0?` · <span class="cat-price">${fmt(s.precio)}</span>`:' · Precio a consultar'}</div>
          </div>
          <button class="cat-btn" onclick="reservarServicio(${s.id})">📅 Reservar</button>
        </div>
      `).join('')}
    `).join('')}
  `;

  _catWA(online, nombre);
}

function reservarServicio(srvId){
  renderBooking();
  setTimeout(function(){
    // renderBooking() siempre agrega su propio botón WA — eliminar duplicados
    var waAll = document.querySelectorAll('.wa-btn');
    for(var i = 1; i < waAll.length; i++) waAll[i].remove();
    // Pre-seleccionar el servicio elegido
    var sel = document.getElementById('bServicio');
    if(sel){
      for(var i=0;i<sel.options.length;i++){
        if(parseInt(sel.options[i].value)===srvId){ sel.selectedIndex=i; onSrvChange(); break; }
      }
    }
    // Botón para volver al catálogo
    var card = document.getElementById('mainCard');
    if(card){
      var back = document.createElement('button');
      back.className = 'cat-back';
      back.textContent = '← Ver todos los servicios';
      back.onclick = renderCatalog;
      card.insertBefore(back, card.firstChild);
    }
    // Scroll suave al inicio del card
    card && card.scrollIntoView({behavior:'smooth',block:'start'});
  }, 50);
}

function _catWA(online, nombre){
  // Botón WA flotante — si ya existe, solo actualizar el href
  const waTel = (online.tel||'').replace(/\D/g,'');
  if(!waTel) return;
  const waMsg = encodeURIComponent('Hola! Quiero consultar antes de reservar en '+nombre+' 😊');

  if(existing){ existing.href = href; return; }
  const a = document.createElement('a');
  a.className = 'wa-btn';

  document.body.appendChild(a);

// ── Init ──────────────────────────────────────────────────────────────────
(async function init(){
  // Leer slug del query param ?s= (puesto por 404.html) o del pathname directo
  const params = new URLSearchParams(location.search);
  let slug = params.get('s') || '';
  let modoNegocio = false;  // ?negocio=SLUG → vista catálogo unificado

  // Si viene del 404 redirect, restaurar URL limpia en el browser
  if(slug && !params.get('_direct')){
    try { history.replaceState(null,'','/b/'+encodeURIComponent(slug)); } catch(e){}
  }

  // Fallback: leer del pathname /b/slug — usa vista catálogo unificado
  if(!slug){
    const m = location.pathname.match(/^\/b\/([^/?#]+)/);
    if(m){ slug = decodeURIComponent(m[1]); modoNegocio = true; }
  }

  // ?negocio=SLUG — página unificada con catálogo + reserva
  if(!slug && params.get('negocio')){
    slug = params.get('negocio');
    modoNegocio = true;
  }

  if(!slug){
    document.getElementById('mainCard').innerHTML = '<div class="msg-err" style="text-align:center;padding:20px">Link inválido. Pedile el link correcto al negocio.</div>';
    return;
  }

  try {
    const result = await resolveSlug(slug);
    if(!result){
      document.getElementById('mainCard').innerHTML = '<div class="msg-err" style="text-align:center;padding:20px">Negocio no encontrado. Verificá el link.</div>';
      return;
    }

    const {turnosCfg, onlineCfg, tenantNombre, tenantRubro} = parseRows(result.rows);
    G.tenantId = result.tenantId;
    G.cfg = turnosCfg;
    G.online = onlineCfg;

    // Intentar obtener datos del tenant
    try {
      const {data:td} = await sb.from('tenants').select('*').eq('id',result.tenantId).single();
      G.tenant = td;
    } catch(e){}

    if(!G.tenant && tenantNombre){
      G.tenant = {id:result.tenantId, nombre:tenantNombre, rubro:tenantRubro};
    }

    if(modoNegocio) renderCatalog(); else renderBooking();
  } catch(e){
    document.getElementById('mainCard').innerHTML = `<div class="msg-err" style="text-align:center;padding:20px">Error al cargar: ${esc(e.message)}</div>`;
  }
})();
</script>
