<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080808">
<title>Reservar turno — Remu Gestión</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#080808;color:#f5f0e8;font-family:sans-serif;min-height:100vh;display:flex;flex-direction:column}
  .hdr{background:#0a0a0a;border-bottom:1px solid #1e1e1e;padding:14px 20px;display:flex;align-items:center;gap:12px}
  .hdr-logo{font-size:1rem;font-weight:800;color:#c9a84c;letter-spacing:1px}
  .hdr-sep{color:#2e2e2e}
  .hdr-neg{font-size:.88rem;font-weight:600}
  .wrap{flex:1;display:flex;justify-content:center;align-items:center;padding:24px 16px}
  .card{background:#111;border:1px solid #1e1e1e;border-radius:16px;width:100%;max-width:440px;padding:24px}
  .msg-err{background:rgba(201,82,76,.08);border:1px solid rgba(201,82,76,.25);border-radius:8px;padding:16px;color:#e87070;font-size:.88rem;text-align:center}
</style>
</head>
<body>
<div class="hdr">
  <span class="hdr-logo">Remu</span>
  <span class="hdr-sep">·</span>
  <span class="hdr-neg">Gestión</span>
</div>
<div class="wrap">
  <div class="card">
    <div id="mainCard" class="msg-err">Link inválido. Pedile el link correcto al negocio.</div>
  </div>
</div>
<script>
(function(){
  const slug = location.pathname.replace(/^\/b\/?/,'').replace(/\/$/,'') || new URLSearchParams(location.search).get('s') || '';
  if(slug) window.location.replace('/p/?s=' + encodeURIComponent(slug));
})();
</script>
</body>
</html>
